<!DOCTYPE html>
<!--
  index.html  --  the live findings viewer for your ransomware detector.

  WHERE THIS GOES : C:\AtomicLab\  (the SAME folder as findings.json)

  HOW TO VIEW IT  : it must be SERVED, not opened by double-clicking.
                    In Command Prompt or PowerShell:
                        cd C:\AtomicLab
                        python -m http.server 8000
                    then open  http://localhost:8000/index.html

  WHY NOT DOUBLE-CLICK : opening the file directly gives a file:/// address,
                    and browsers refuse to let a file:/// page read another
                    file. The table would stay permanently empty with a CORS
                    error in the console. Always serve it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ransomware Detection - Live Findings</title>
  <style>
    body   { font-family: Arial, Helvetica, sans-serif; background: #f5f7fa;
             padding: 24px; color: #222; }
    h2     { color: #1F4E78; margin: 0 0 2px 0; }
    .sub   { color: #667; margin: 0 0 18px 0; font-size: 13px; }
    table  { border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px #0002; }
    th     { background: #1F4E78; color: #fff; text-align: left; padding: 9px 12px;
             font-size: 13px; }
    td     { padding: 9px 12px; border-top: 1px solid #e3e8ee; font-size: 13px;
             vertical-align: top; }
    .sev   { color: #fff; font-weight: bold; text-align: center; white-space: nowrap; }
    .empty { color: #888; background: #fff; padding: 16px; border-radius: 4px;
             box-shadow: 0 1px 3px #0002; display: inline-block; }
    .meta  { color: #8a94a0; font-size: 12px; margin-top: 12px; }
    .err   { color: #a33; background: #fff3f3; border-left: 3px solid #e74c3c;
             padding: 12px 14px; margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>

  <h2>Ransomware Detection &mdash; Live Findings</h2>
  <p class="sub">Sysmon FileCreate burst analysis &middot; detected by detector.py,
     stored in incidents.db</p>

  <div id="out"><p class="empty">Loading&hellip;</p></div>
  <p class="meta" id="meta"></p>

<script>
// colour by severity - matches the severity_for() function in detector.py
function colour(sev) {
  if (sev === 'Critical') return '#c0392b';
  if (sev === 'High')     return '#e74c3c';
  if (sev === 'Medium')   return '#f39c12';
  return '#95a5a6';                           // Low / Info
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function load() {
  const out = document.getElementById('out');
  const meta = document.getElementById('meta');
  try {
    // the ?t= cache-buster forces a fresh read every time
    const res = await fetch('findings.json?t=' + Date.now());

    if (res.status === 404) {
      out.innerHTML = '<p class="empty">No findings yet &mdash; '
        + 'run <b>python detector.py sysmon_events.csv</b> to populate this.</p>';
      meta.textContent = 'findings.json does not exist yet. Checked at '
        + new Date().toLocaleTimeString();
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const rows = await res.json();

    if (!rows.length) {
      out.innerHTML = '<p class="empty">No findings yet &mdash; '
        + 'the detector reported CLEAN.</p>';
    } else {
      let html = '<table><tr><th>Time</th><th>Finding</th>'
               + '<th>Severity</th></tr>';
      // newest first
      rows.slice().reverse().forEach(function (r) {
        html += '<tr><td>' + esc(r.time) + '</td>'
              + '<td>' + esc(r.summary) + '</td>'
              + '<td class="sev" style="background:' + colour(r.severity) + '">'
              + esc(r.severity) + '</td></tr>';
      });
      out.innerHTML = html + '</table>';
    }
    meta.textContent = rows.length + ' finding(s) \u00b7 refreshed at '
      + new Date().toLocaleTimeString() + ' \u00b7 auto-refreshing every 3s';

  } catch (e) {
    out.innerHTML = '<div class="err"><b>Could not read findings.json.</b><br>'
      + 'If the address bar starts with <b>file:///</b> that is the problem &mdash; '
      + 'this page must be served. Run <b>python -m http.server 8000</b> in '
      + 'C:\\AtomicLab and open <b>http://localhost:8000/index.html</b>.<br>'
      + 'Error: ' + esc(e.message) + '</div>';
    meta.textContent = '';
  }
}

load();
setInterval(load, 3000);
</script>

</body>
</html>
